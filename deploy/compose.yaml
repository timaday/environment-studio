# Hosted PostgreSQL pilot Compose example, not an assumed HiveForge-specific manifest.
services:
  environment-studio-workspace-init:
    image: ${STUDIO_IMAGE:?Set STUDIO_IMAGE to the published ghcr.io image digest}
    platform: linux/amd64
    profiles: ["init"]
    command: ["--initialize-workspace-v3=/workspace"]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    volumes:
      - type: bind
        source: ${STUDIO_WORKSPACE_HOST_PATH:?Set STUDIO_WORKSPACE_HOST_PATH to an initialized private host directory owned by uid/gid 10001}
        target: /workspace

  environment-studio:
    image: ${STUDIO_IMAGE:?Set STUDIO_IMAGE to the published ghcr.io image digest}
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STUDIO_HOST_PORT:-18181}:8080"
    environment:
      STUDIO_MODE: hosted
      STUDIO_SECURITY_PUBLIC_ORIGIN: ${STUDIO_SECURITY_PUBLIC_ORIGIN:-http://localhost:18181}
      STUDIO_SECURITY_LOCAL_OPERATOR_ENABLED: "true"
      STUDIO_SECURITY_LOCAL_OPERATOR_USERNAME: ${STUDIO_SECURITY_LOCAL_OPERATOR_USERNAME:-operator}
      STUDIO_SECURITY_LOCAL_OPERATOR_PASSWORD: ${STUDIO_SECURITY_LOCAL_OPERATOR_PASSWORD:?Set a local operator password through your secret facility; do not commit it}
      STUDIO_SECURITY_LOCAL_OPERATOR_ISSUER: ${STUDIO_SECURITY_LOCAL_OPERATOR_ISSUER:-https://local-operator.environment-studio.invalid}
      STUDIO_SECURITY_LOCAL_OPERATOR_SUBJECT: ${STUDIO_SECURITY_LOCAL_OPERATOR_SUBJECT:-operator}
      STUDIO_WORKSPACE_DIRECTORY: /workspace
      SERVER_SERVLET_SESSION_COOKIE_SECURE: ${STUDIO_SESSION_COOKIE_SECURE:-false}
      SPRING_APPLICATION_JSON: >-
        {
          "studio": {
            "workspace": {
              "definition-publishers": [
                {
                  "issuer": "${STUDIO_DEFINITION_PUBLISHER_ISSUER:-https://local-operator.environment-studio.invalid}",
                  "subject": "${STUDIO_DEFINITION_PUBLISHER_SUBJECT:-operator}"
                }
              ]
            },
            "plans": {
              "destinations": [
                {
                  "id": "${STUDIO_PG_DESTINATION_ID:-postgresql-pilot}",
                  "engine": "postgresql",
                  "host": "${STUDIO_PG_HOST:?Set PostgreSQL host name}",
                  "port": ${STUDIO_PG_PORT:-5432},
                  "database": "${STUDIO_PG_DATABASE:?Set PostgreSQL database name}",
                  "trust-material": "/run/studio/postgres-ca.pem",
                  "transport-identity": "${STUDIO_PG_TRANSPORT_IDENTITY_SHA256:?Set approved 64 lowercase hex endpoint/trust identity}",
                  "expected-physical-identity": {
                    "systemIdentifier": "${STUDIO_PG_SYSTEM_IDENTIFIER:?Set observed pg_control_system system_identifier}",
                    "databaseOid": "${STUDIO_PG_DATABASE_OID:?Set observed database oid}",
                    "databaseName": "${STUDIO_PG_DATABASE:?Set PostgreSQL database name}"
                  },
                  "provisioning-policy-version": "${STUDIO_PG_PROVISIONING_POLICY_VERSION:-postgresql-pilot-readonly-v1}",
                  "operation-policy-version": "postgresql-read-operation-v1",
                  "owners": [
                    {
                      "issuer": "${STUDIO_DESTINATION_OWNER_ISSUER:-https://local-operator.environment-studio.invalid}",
                      "subject": "${STUDIO_DESTINATION_OWNER_SUBJECT:-operator}"
                    }
                  ]
                }
              ]
            }
          }
        }
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    volumes:
      - type: bind
        source: ${STUDIO_WORKSPACE_HOST_PATH:?Set STUDIO_WORKSPACE_HOST_PATH to an initialized private host directory owned by uid/gid 10001}
        target: /workspace
      - type: bind
        source: ${STUDIO_PG_TRUST_MATERIAL_HOST_PATH:?Set absolute host path to the PostgreSQL PEM CA bundle}
        target: /run/studio/postgres-ca.pem
        read_only: true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 30s
    ulimits:
      core: 0
