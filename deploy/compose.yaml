# Standard Compose example, not an assumed HiveForge-specific manifest.
services:
  environment-studio:
    image: ${STUDIO_IMAGE:?Set STUDIO_IMAGE to the published ghcr.io image digest}
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      STUDIO_MODE: demo
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 30s
    ulimits:
      core: 0
