# Local Dockerized demo example with no OIDC and no database access.
# This is for synthetic UI/process rehearsal only. Use compose.yaml for hosted PostgreSQL.
services:
  environment-studio-demo:
    image: ${STUDIO_IMAGE:-environment-studio:local-operator}
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STUDIO_HOST_PORT:-18080}:8080"
    environment:
      STUDIO_MODE: demo
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 30s
    ulimits:
      core: 0
