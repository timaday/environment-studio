kind: component
component:
  name: service
  project: environment-studio
deployment:
  adapter: ansible
  actions:
    deploy:
      playbook: deploy/hiveforge/deploy.yml
    remove:
      playbook: deploy/hiveforge/remove.yml
    update:
      playbook: deploy/hiveforge/update.yml
requirements:
  environment:
    - HIVEFORGE_PROFILE
    - STUDIO_IMAGE
    - STUDIO_SECURITY_PUBLIC_ORIGIN
    - STUDIO_SECURITY_LOCAL_OPERATOR_PASSWORD
    - STUDIO_WORKSPACE_HOST_PATH
