openapi: 3.1.0
info:
  title: Environment Studio API
  version: 0.1.0
  description: Demo capabilities, hosted sessions and private definition drafts. Configured hosted inspection APIs enforce operation admission; inspection UI and export remain unqualified.
paths:
  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      summary: Read implemented runtime capability state
      responses:
        '200':
          description: UI availability and backend composition are separate; configured inspection APIs still enforce each operation's admission
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [mode, definitionWorkspaceEnabled, inspectionEnabled, inspectionUiEnabled, inspectionApiConfigured, exportEnabled, qualifiedDatabaseAdapters, blockers]
                properties:
                  mode: {type: string, enum: [demo, hosted]}
                  definitionWorkspaceEnabled: {type: boolean}
                  inspectionEnabled:
                    type: boolean
                    const: false
                    deprecated: true
                    description: Compatibility alias equal to inspectionUiEnabled; never server operation authority
                  inspectionUiEnabled:
                    type: boolean
                    const: false
                    description: Qualified operator inspection UI availability
                  inspectionApiConfigured:
                    type: boolean
                    description: Hosted workspace and valid destinations compose the backend service; not qualification, connectivity or per-owner admission
                  exportEnabled: {type: boolean, const: false}
                  qualifiedDatabaseAdapters:
                    type: array
                    maxItems: 0
                    items: {type: string}
                  blockers:
                    type: array
                    items: {type: string}
  /actuator/health/readiness:
    get:
      operationId: getReadiness
      summary: Process readiness, independent of any configuration plan
      responses:
        '200': {description: Process ready}
        '503': {description: Process not ready}
  /api/v1/session:
    get:
      operationId: getSession
      summary: Read authenticated hosted session and CSRF token without caching
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Owned session; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [authenticated, csrfHeaderName, csrfToken, idleTimeoutSeconds, absoluteExpiresAt]
                properties:
                  authenticated: {type: boolean, const: true}
                  csrfHeaderName: {type: string}
                  csrfToken: {type: string}
                  idleTimeoutSeconds: {type: integer, const: 1800}
                  absoluteExpiresAt: {type: string, format: date-time}
        '401': {description: No valid authenticated hosted session}
        '403': {description: Host or Origin refused, or endpoint unavailable in demo mode}
  /api/v1/session/logout:
    post:
      operationId: logoutSession
      summary: Revoke hosted session and clean up owned transient resources
      description: Requires approved Host/Origin and the current session CSRF header/token.
      security: [{sessionCookie: []}]
      responses:
        '204': {description: Session revoked and cleanup complete}
        '401': {description: No valid authenticated session}
        '403': {description: Origin/CSRF refused, or endpoint unavailable in demo mode}
        '503': {description: SESSION_CLEANUP_INCONCLUSIVE; session revoked and capacity quarantined}
  /api/v1/definitions:
    get:
      operationId: listDefinitions
      summary: List current owned draft metadata in object-ID order
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Owned metadata only; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [definitions]
                properties:
                  definitions:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      additionalProperties: false
                      required: [objectId, workspaceRevision, nativeId, nativeRevision, sourceDigest]
                      properties:
                        objectId: {type: string, format: uuid}
                        workspaceRevision: {$ref: '#/components/schemas/PositiveRevision'}
                        nativeId: {type: string}
                        nativeRevision: {$ref: '#/components/schemas/PositiveRevision'}
                        sourceDigest: {$ref: '#/components/schemas/SourceDigest'}
        '401': {description: No valid hosted session}
        '403': {description: Host/Origin refused or unavailable in demo mode}
        '503': {$ref: '#/components/responses/WorkspaceUnavailable'}
  /api/v1/definitions/{objectId}:
    parameters:
      - {$ref: '#/components/parameters/ObjectId'}
    get:
      operationId: getDefinition
      summary: Read current owned immutable draft revision
      security: [{sessionCookie: []}]
      responses:
        '200': {$ref: '#/components/responses/DefinitionRevision'}
        '400': {$ref: '#/components/responses/WorkspaceInvalid'}
        '401': {description: No valid hosted session}
        '403': {description: Host/Origin refused or unavailable in demo mode}
        '404': {$ref: '#/components/responses/DefinitionMissing'}
        '503': {$ref: '#/components/responses/WorkspaceUnavailable'}
    put:
      operationId: saveDefinitionDraft
      summary: Compile and atomically save an owned v1 draft revision
      description: Requires current session CSRF header and approved Host/Origin. Exact replay returns the original result before revision checking or compilation. See definition-workspace.md for strict UTF-8 and size budgets.
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, requestId, format, source]
              properties:
                expectedRevision: {type: string, pattern: '^(0|[1-9][0-9]*)$', maxLength: 1024}
                requestId: {type: string, format: uuid}
                format: {type: string, enum: [JSON, YAML]}
                source: {type: string, description: Exact native source; at most 1 MiB strict UTF-8}
      responses:
        '200': {$ref: '#/components/responses/DefinitionRevision'}
        '400': {$ref: '#/components/responses/WorkspaceInvalid'}
        '401': {description: No valid hosted session}
        '403': {description: Host/Origin/CSRF refused or unavailable in demo mode}
        '409': {description: Stale revision, changed native ID or conflicting request-ID reuse}
        '413': {description: Wrapper/source/record capacity exceeded; nothing saved}
        '422':
          description: Compilation rejected; nothing saved
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [kind, diagnostics]
                properties:
                  kind: {type: string, const: rejected}
                  diagnostics: {$ref: '#/components/schemas/Diagnostics'}
        '503': {$ref: '#/components/responses/WorkspaceUnavailable'}
  /api/v1/definitions/{objectId}/revisions/{revision}:
    parameters:
      - {$ref: '#/components/parameters/ObjectId'}
      - name: revision
        in: path
        required: true
        schema: {$ref: '#/components/schemas/PositiveRevision'}
    get:
      operationId: getDefinitionRevision
      summary: Read the originally saved projection without recompilation
      security: [{sessionCookie: []}]
      responses:
        '200': {$ref: '#/components/responses/DefinitionRevision'}
        '400': {$ref: '#/components/responses/WorkspaceInvalid'}
        '401': {description: No valid hosted session}
        '403': {description: Host/Origin refused or unavailable in demo mode}
        '404': {$ref: '#/components/responses/DefinitionMissing'}
        '503': {$ref: '#/components/responses/WorkspaceUnavailable'}
  /actuator/health/liveness:
    get:
      operationId: getLiveness
      summary: Process liveness
      responses:
        '200': {description: Process live}
        '503': {description: Process unhealthy}
  /api/v1/plans/{planId}/materializations:
    $ref: './openapi-plans-v1.json#/paths/~1api~1v1~1plans~1{planId}~1materializations'

  /api/v1/plans/{planId}/views/documents:
    $ref: './openapi-plans-v1.json#/paths/~1api~1v1~1plans~1{planId}~1views~1documents'

  /api/v1/plans/{planId}/views/entities:
    $ref: './openapi-plans-v1.json#/paths/~1api~1v1~1plans~1{planId}~1views~1entities'

  /api/v1/plans/{planId}/views/relations:
    $ref: './openapi-plans-v1.json#/paths/~1api~1v1~1plans~1{planId}~1views~1relations'

  /api/v1/plans/{planId}/views/draft:
    $ref: './openapi-plans-v1.json#/paths/~1api~1v1~1plans~1{planId}~1views~1draft'

  /api/v1/plans/{planId}/views/containment:
    $ref: './openapi-plans-v1.json#/paths/~1api~1v1~1plans~1{planId}~1views~1containment'

  /api/v1/plans/{planId}/views/placements:
    $ref: './openapi-plans-v1.json#/paths/~1api~1v1~1plans~1{planId}~1views~1placements'

  /api/v1/plans/{planId}/views/document:
    $ref: './openapi-plans-v1.json#/paths/~1api~1v1~1plans~1{planId}~1views~1document'

  /api/v1/plans/{planId}/profile-captures:
    $ref: './openapi-plans-v1.json#/paths/~1api~1v1~1plans~1{planId}~1profile-captures'

  /api/v1/plans/{planId}/profile-previews:
    $ref: './openapi-plans-v1.json#/paths/~1api~1v1~1plans~1{planId}~1profile-previews'

  /api/v1/plans/{planId}/validations:
    $ref: './openapi-plans-v1.json#/paths/~1api~1v1~1plans~1{planId}~1validations'

  /api/v1/plans/{planId}/views/bindings:
    $ref: './openapi-plans-v1.json#/paths/~1api~1v1~1plans~1{planId}~1views~1bindings'

  /api/v1/plans/{planId}/views/binding-locations:
    $ref: './openapi-plans-v1.json#/paths/~1api~1v1~1plans~1{planId}~1views~1binding-locations'

  /api/v3/plans:
    $ref: './openapi-plans-v3.json#/paths/~1api~1v3~1plans'

  /api/v3/plans/current:
    $ref: './openapi-plans-v3.json#/paths/~1api~1v3~1plans~1current'

  /api/v3/plans/{planId}:
    $ref: './openapi-plans-v3.json#/paths/~1api~1v3~1plans~1{planId}'

  /api/v3/plans/{planId}/inspections:
    $ref: './openapi-plans-v3.json#/paths/~1api~1v3~1plans~1{planId}~1inspections'

  /api/v3/operations/{operationId}/credentials:
    $ref: './openapi-plans-v3.json#/paths/~1api~1v3~1operations~1{operationId}~1credentials'

  /api/v3/operations/{operationId}:
    $ref: './openapi-plans-v3.json#/paths/~1api~1v3~1operations~1{operationId}'

  /api/v3/operations/{operationId}/cancel:
    $ref: './openapi-plans-v3.json#/paths/~1api~1v3~1operations~1{operationId}~1cancel'

  /api/v3/plans/{planId}/commands:
    $ref: './openapi-plans-v3.json#/paths/~1api~1v3~1plans~1{planId}~1commands'

  /api/v3/plans/{planId}/materializations:
    $ref: './openapi-plans-v3.json#/paths/~1api~1v3~1plans~1{planId}~1materializations'

  /api/v3/plans/{planId}/views/documents:
    $ref: './openapi-plans-v3.json#/paths/~1api~1v3~1plans~1{planId}~1views~1documents'

  /api/v3/plans/{planId}/views/entities:
    $ref: './openapi-plans-v3.json#/paths/~1api~1v3~1plans~1{planId}~1views~1entities'

  /api/v3/plans/{planId}/views/relations:
    $ref: './openapi-plans-v3.json#/paths/~1api~1v3~1plans~1{planId}~1views~1relations'

  /api/v3/plans/{planId}/views/draft:
    $ref: './openapi-plans-v3.json#/paths/~1api~1v3~1plans~1{planId}~1views~1draft'

  /api/v3/plans/{planId}/views/containment:
    $ref: './openapi-plans-v3.json#/paths/~1api~1v3~1plans~1{planId}~1views~1containment'

  /api/v3/plans/{planId}/views/placements:
    $ref: './openapi-plans-v3.json#/paths/~1api~1v3~1plans~1{planId}~1views~1placements'

  /api/v3/plans/{planId}/views/bindings:
    $ref: './openapi-plans-v3.json#/paths/~1api~1v3~1plans~1{planId}~1views~1bindings'

components:
  parameters:
    ObjectId:
      name: objectId
      in: path
      required: true
      schema: {type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'}
  schemas:
    PositiveRevision: {type: string, pattern: '^[1-9][0-9]*$', maxLength: 1024}
    SourceDigest: {type: string, pattern: '^[0-9a-f]{64}$'}
    Diagnostics:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [phase, code, pointer, message]
        properties:
          phase: {type: string, enum: [parse, shape, semantic, publication]}
          code: {type: string}
          pointer: {type: string}
          message: {type: string}
    WorkspaceError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: {type: string, pattern: '^WORKSPACE_'}
        message: {type: string}
    DefinitionRevision:
      type: object
      additionalProperties: false
      required: [objectId, workspaceRevision, sourceDigest, format, source, compilerVersion, schemaVersion, projection]
      properties:
        objectId: {type: string, format: uuid}
        workspaceRevision: {$ref: '#/components/schemas/PositiveRevision'}
        sourceDigest: {$ref: '#/components/schemas/SourceDigest'}
        format: {type: string, enum: [JSON, YAML]}
        source: {type: string}
        compilerVersion: {type: string, const: definition-compiler-d01a}
        schemaVersion: {type: string, const: '1'}
        projection:
          type: object
          additionalProperties: false
          required: [kind, model, diagnostics]
          properties:
            kind: {type: string, const: incomplete}
            model: {$ref: '../../schemas/definition-inspection-v1.schema.json'}
            diagnostics: {$ref: '#/components/schemas/Diagnostics'}
  responses:
    DefinitionRevision:
      description: Original immutable revision and projection; Cache-Control no-store
      content:
        application/json:
          schema: {$ref: '#/components/schemas/DefinitionRevision'}
    WorkspaceInvalid:
      description: Invalid bounded wrapper, identifier or revision; nothing saved
      content:
        application/json:
          schema: {$ref: '#/components/schemas/WorkspaceError'}
    DefinitionMissing:
      description: Missing and cross-owner objects have the same response
      content:
        application/json:
          schema: {$ref: '#/components/schemas/WorkspaceError'}
    WorkspaceUnavailable:
      description: Workspace absent, exhausted, damaged or unavailable; no success assumed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/WorkspaceError'}
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
